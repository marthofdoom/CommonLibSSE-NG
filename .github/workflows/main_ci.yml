name: Main CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/main_ci.yml'
      - 'cmake/**'
      - 'include/**'
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'conanfile.py'
      - 'vcpkg.json'
  pull_request:
    branches: [ main, feature/* ]
  workflow_dispatch:

env:
  VCPKG_COMMIT_ID: 19780d9cdf84d0944cf9a318666703b89ab6629c

jobs:
  build-and-test-vcpkg:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - debug
          - release
        runtime:
          - all
          - flatrim
          - ae
          - se
          - vr
        compiler:
          - msvc
          - clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: main

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1.10.0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: true

      - name: Build
        uses: lukka/run-cmake@v10.9
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/main/CMakeLists.txt
          configurePreset: build-${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
          buildPreset: ${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}

      - name: Unit tests
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/main/build/${{ matrix.build-type }}-${{ matrix.compiler }}-vcpkg-${{ matrix.runtime }}
        run: .\CommonLibSSETests.exe
  build-and-test-conan:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - debug
          - release
        runtime:
          - all
          - flatrim
          - ae
          - se
          - vr
        compiler:
          - msvc
          - clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: main

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1.10.0

      - name: Install Conan
        shell: bash
        run: python -m pip install "conan==2.33.0"

      - name: Detect Conan profile
        shell: bash
        run: |
          # Conan 2 detects the runner's Visual Studio (compiler=msvc) itself. The CMake generator is Ninja.
          conan profile detect --force
          conan profile show

      - name: Run Conan
        working-directory: ${{ github.workspace }}/main
        run: conan install . --build=missing -s build_type=${{ matrix.build-type == 'debug' && 'Debug' || 'Release' }} -o "&:testing=True" -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Build with CMake
        uses: lukka/run-cmake@v10.9
        with:
          cmakeListsTxtPath: ${{ github.workspace }}/main/CMakeLists.txt
          configurePreset: build-${{ matrix.build-type }}-${{ matrix.compiler }}-conan-${{ matrix.runtime }}
          buildPreset: ${{ matrix.build-type }}-${{ matrix.compiler }}-conan-${{ matrix.runtime }}

      - name: Build with Conan
        if: matrix.compiler == 'msvc' && matrix.runtime == 'all'
        working-directory: ${{ github.workspace }}/main
        run: conan build . --build=missing -s build_type=${{ matrix.build-type == 'debug' && 'Debug' || 'Release' }} -o "&:testing=True" -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Unit tests
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}/main/build/${{ matrix.build-type }}-${{ matrix.compiler }}-conan-${{ matrix.runtime }}
        run: .\CommonLibSSETests.exe

      - name: Create Conan Package
        if: matrix.compiler == 'msvc' && matrix.runtime == 'all'
        working-directory: ${{ github.workspace }}/main
        run: conan create . --build=missing -s build_type=${{ matrix.build-type == 'debug' && 'Debug' || 'Release' }} -c tools.cmake.cmaketoolchain:generator=Ninja
